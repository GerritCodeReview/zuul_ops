diskimages: []
zookeeper-servers:
  - host: zookeeper.zookeeper
    port: 2281
zookeeper-tls:
  ca: /tls/client/ca.crt
  cert: /tls/client/tls.crt
  key: /tls/client/tls.key
providers:
  - name: gcloud-provider
    driver: gce
    project: gerritcodereview-ci
    region: us-central1
    zone: us-central1-a
    boot-timeout: 120
    cloud-images:
      - name: debian-bookworm
        image-project: debian-cloud
        image-family: debian-12
        username: zuul
        key: ssh-rsa  zuul
    pools:
      - name: main
        max-servers: 3
        use-internal-ip: True
        # Gate node readiness on SSH/host-key-scan reachability
        # (nodepool's GCE default). With this enabled nodepool verifies a node
        # is SSH/host-key-scan reachable before handing it to the executor, and
        # relaunches nodes that never become reachable. This relies on
        # the launcher being able to reach the node internal IP, which
        # is how this deployment is configured. It was
        # previously disabled to dodge a GCE baked-in-host-key race
        # (the image host key is regenerated a few seconds into boot);
        # that removed the readiness gate and let the executor receive
        # not-yet-SSH-ready nodes, causing intermittent RETRY_LIMIT
        # (~1/3 of builds; see issue 502048297). On this Debian image
        # serial output shows host keys are regenerated before sshd
        # binds, so a post-sshd ssh-keyscan should capture the
        # regenerated key, not the baked-in one. Validate the
        # RETRY_LIMIT rate post-merge; roll back if host-key-scan
        # failures appear in the launcher log.
        host-key-checking: True
        labels:
          - name: debian-bookworm-8G
            instance-type: n1-standard-2
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-30G
            instance-type: n1-standard-8
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-60G
            instance-type: n1-standard-16
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-n1-standard-2
            instance-type: n1-standard-2
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-n1-standard-8
            instance-type: n1-standard-8
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-n1-standard-16
            instance-type: n1-standard-16
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-e2-standard-2
            instance-type: e2-standard-2
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-e2-standard-8
            instance-type: e2-standard-8
            cloud-image: debian-bookworm
            volume-size: 40
          - name: debian-bookworm-e2-standard-16
            instance-type: e2-standard-16
            cloud-image: debian-bookworm
            volume-size: 40

labels:
  - name: debian-bookworm-8G
    min-ready: 0
  - name: debian-bookworm-30G
    min-ready: 0
  - name: debian-bookworm-60G
    min-ready: 0
  - name: debian-bookworm-n1-standard-2
    min-ready: 0
  - name: debian-bookworm-n1-standard-8
    min-ready: 0
  - name: debian-bookworm-n1-standard-16
    min-ready: 0
  - name: debian-bookworm-e2-standard-2
    min-ready: 0
  - name: debian-bookworm-e2-standard-8
    min-ready: 0
  - name: debian-bookworm-e2-standard-16
    min-ready: 0
