- name: Setup kubeconfig path vars
  hosts: localhost
  tasks:
    - name: Set kubeconfig path fact
      set_fact:
        kubeconfig_dir: "{{ zuul.executor.work_root }}/.kube"
    - name: Set kubeconfig path fact
      set_fact:
        kubeconfig_path: "{{ zuul.executor.work_root }}/.kube/config"

- name: Update checkers
  gather_facts: false
  hosts: localhost
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tasks:
    - name: Add scheduler to inventory
      add_host:
        name: 'zuul-scheduler-0'
        ansible_kubectl_config: "{{ kubeconfig_path }}"
        ansible_kubectl_namespace: zuul
        ansible_connection: kubectl
    - name: Load checker data
      include_vars:
        file: "../checkers.yaml"
    - name: Update Checkers
      delegate_to: 'zuul-scheduler-0'
      update_checkers:
        checkers: "{{ checkers }}"
